<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Expedite Consults LLC</title>
    <meta name="description" content="Expedite Consults LLC — the clip, playing." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Figtree:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1c1916;
        --cream: #f7f2e9;
        --brick: #8b3d2a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--ink);
        color: var(--cream);
        font-family: Figtree, system-ui, sans-serif;
      }
      .stage {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      }
      .plate {
        position: relative;
        width: min(22rem, 92vw);
        aspect-ratio: 9 / 16;
        background: #111;
        border: 8px solid #efe8dc;
        box-shadow: inset 0 0 0 1px #c9bfb0;
        overflow: hidden;
      }
      .plate iframe {
        position: absolute;
        top: -8%;
        left: -2%;
        width: 116%;
        height: 122%;
        border: 0;
        pointer-events: none;
      }
      .plate img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        object-fit: cover;
        object-position: center 18%;
      }
      .plate:after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        z-index: 2;
        width: 7rem;
        height: 2.75rem;
        background: var(--ink);
        pointer-events: none;
      }
      .shade {
        pointer-events: none;
        position: absolute;
        inset: auto 0 0;
        padding: 4.5rem 12px 0;
        background: linear-gradient(to top, #1c1916, rgba(28,25,22,.75), transparent);
      }
      .name {
        font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
        font-size: 1.7rem;
        letter-spacing: .04em;
        margin: 0;
      }
      .title {
        margin: .2rem 0 0;
        font-size: .8rem;
        opacity: .75;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .house {
        margin-top: 10px;
        padding: 8px 0;
        text-align: right;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .16em;
      }
      .go {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(28,25,22,.28);
        border: 0;
        cursor: pointer;
        color: var(--cream);
      }
      .go span {
        width: 72px;
        height: 72px;
        border-radius: 999px;
        background: var(--brick);
        display: grid;
        place-items: center;
        font-size: 28px;
      }
      .mark {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(28, 25, 22, 0.9);
        color: var(--cream);
        padding: 4px 8px 4px 4px;
        font-family: "Big Shoulders Display", "Arial Narrow", sans-serif;
        font-size: 18px;
        letter-spacing: 0.06em;
        line-height: 1;
      }
      .mark svg { width: 22px; height: 22px; display: block; }
      .foot {
        margin-top: 14px;
        font-size: 11px;
        letter-spacing: .18em;
        text-transform: uppercase;
        opacity: .6;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <article class="plate" id="plate">
        <span class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#f7f2e9"/><path fill="#1c1916" d="M23.4 8.4c-1.8-1.6-4.3-2.5-7.6-2.5-6.8 0-11 4.1-11 10.1s4.2 10.1 11 10.1c3.3 0 5.8-.9 7.6-2.5l-2.6-2.8c-1.1 1-2.7 1.5-5 1.5-4.1 0-6.6-2.5-6.6-6.3s2.5-6.3 6.6-6.3c2.3 0 3.9.6 5 1.5l2.6-2.8z"/><rect x="15.6" y="13.7" width="10.6" height="4.6" rx="0.7" fill="#8b3d2a"/></svg>ConnectLn</span>
        <img id="still" alt="" />
        <div id="well"></div>
        <div class="shade">
          <p class="name">Expedite Consults LLC</p>
          <p class="title" id="caption"></p>
          <p class="house">EXPEDITE CONSULTS LLC</p>
        </div>
        <button class="go" id="go" type="button" aria-label="Play"><span>▶</span></button>
      </article>
      <p class="foot">ConnectLn · the hall</p>
    </div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var id = (q.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 11);
        var title = q.get("t") || "Shop talk";
        document.getElementById("caption").textContent = title;
        document.title = "Expedite Consults LLC · " + title;
        var still = document.getElementById("still");
        var well = document.getElementById("well");
        var go = document.getElementById("go");
        if (!id || id.length !== 11) {
          go.querySelector("span").textContent = "!";
          return;
        }
        still.src = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
        function play() {
          var src =
            "https://www.youtube-nocookie.com/embed/" +
            id +
            "?autoplay=1&mute=0&rel=0&modestbranding=1&playsinline=1&controls=0&fs=0&iv_load_policy=3";
          well.innerHTML =
            '<iframe src="' +
            src +
            '" allow="autoplay; encrypted-media" title="ConnectLn"></iframe>';
          go.style.display = "none";
        }
        go.addEventListener("click", play);
        window.addEventListener("load", function () {
          window.setTimeout(play, 240);
        });
      })();
    </script>
  </body>
</html>
